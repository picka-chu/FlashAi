name: Keep Render awake

# Render's free tier spins a web service down after 15 minutes without inbound
# traffic. A 5-minute ping keeps it warm 24/7 without any third-party account.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        shell: bash
        run: |
          url="https://flash-6tuz.onrender.com/api/health"
          for attempt in 1 2 3; do
            code="$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 90 "$url" || true)"
            body="$(cat /tmp/health.json 2>/dev/null || true)"
            echo "attempt ${attempt}: HTTP ${code:-000} ${body}"
            if [ "$code" = "200" ] && printf '%s' "$body" | grep -q '"status"[[:space:]]*:[[:space:]]*"ok"'; then
              exit 0
            fi
            [ "$attempt" -lt 3 ] && sleep 20
          done
          echo "::error::Health check failed after 3 attempts - the service may be down or cold-starting."
          exit 1
