name: Keep Render awake

# Render's free tier spins a web service down after 15 minutes without inbound
# traffic. GitHub's scheduled jobs can start a few minutes late, so each run
# pings once a minute for ~4 minutes: consecutive runs then leave at most a
# ~2-3 minute idle gap even when the cron is delayed. No third-party account.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping /api/health (4x, 60s apart)
        shell: bash
        run: |
          url="https://flash-6tuz.onrender.com/api/health"
          ok=0
          for i in 1 2 3 4; do
            code="$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 90 "$url" || true)"
            body="$(cat /tmp/health.json 2>/dev/null || true)"
            echo "ping ${i}: HTTP ${code:-000} ${body}"
            if [ "$code" = "200" ] && printf '%s' "$body" | grep -q '"status"[[:space:]]*:[[:space:]]*"ok"'; then
              ok=1
            fi
            [ "$i" -lt 4 ] && sleep 60
          done
          if [ "$ok" != "1" ]; then
            echo "::error::All 4 health checks failed - the service may be down or out of free instance hours."
            exit 1
          fi
